<div class="header">

<script>
const SERIES = [
  { id: 'WPUFD49207',         label: 'Producer Price Index', short: 'Producer Price Index', color: '#1565C0', thick: true,  on: true  },
  { id: 'CUUR000SA0',         label: 'Consumer Price Index', short: 'Consumer Price Index', color: '#546E7A', thick: true,  on: false },
  { id: 'PCU49211492110P',    label: 'Parcel',               short: 'Parcel',               color: '#E65100', thick: false, on: true  },
  { id: 'PCU484122484122',    label: 'LTL Trucking',         short: 'LTL',                  color: '#2E7D32', thick: false, on: true  },
  { id: 'PCU484121484121',    label: 'Truckload',            short: 'Truckload',            color: '#C62828', thick: false, on: true  },
  { id: 'PCU483111PCU483111', label: 'Ocean Freight',        short: 'Ocean',                color: '#006064', thick: false, on: false },
  { id: 'PCU481112481112',    label: "Int'l Scheduled Air",  short: "Int'l Air",            color: '#4527A0', thick: false, on: false },
  { id: 'PCU482111482111',    label: 'Intermodal Rail',      short: 'Intermodal',           color: '#5D4037', thick: false, on: false },
];

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(key) {
  const [y, m] = key.split('-');
  return `${MONTHS[+m-1]} '${y.slice(2)}`;
}

// ── Chart renderer ────────────────────────────────────────────────
const PAD = { top: 20, right: 20, bottom: 80, left: 58 };
let hoverIdx = -1;

function getCanvas() { return document.getElementById('priceChart'); }

function resize() {
  const canvas = getCanvas();
  const wrap = document.getElementById('chartWrap');
  const W = wrap.clientWidth - 16;
  const H = Math.round(W * 0.52);
  canvas.width  = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  draw();
}

function getScale() {
  let mn = Infinity, mx = -Infinity;
  SERIES.forEach(s => {
    if (!s.on) return;
    const vals = EMBEDDED.series[s.id] || [];
    vals.forEach(v => { if (v != null) { mn = Math.min(mn, v); mx = Math.max(mx, v); } });
  });
  if (!isFinite(mn)) { mn = 0.9; mx = 1.1; }
  const pad = (mx - mn) * 0.08 || 0.02;
  mn -= pad; mx += pad;
  // nice tick step
  const range = mx - mn;
  const rawStep = range / 6;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const step = Math.ceil(rawStep / mag) * mag;
  const lo = Math.floor(mn / step) * step;
  const hi = Math.ceil(mx / step) * step;
  return { min: lo, max: hi, step };
}

function toCanvasXY(canvas, i, v, scale) {
  const W = canvas.width / devicePixelRatio;
  const H = canvas.height / devicePixelRatio;
  const n = EMBEDDED.dates.length;
  const x = PAD.left + (i / (n - 1)) * (W - PAD.left - PAD.right);
  const y = PAD.top  + (1 - (v - scale.min) / (scale.max - scale.min)) * (H - PAD.top - PAD.bottom);
  return [x, y];
}

function draw() {
  const canvas = getCanvas();
  const ctx = canvas.getContext('2d');
  const dpr = devicePixelRatio;
  const W = canvas.width / dpr;
  const H = canvas.height / dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const scale = getScale();
  const n = EMBEDDED.dates.length;
  const plotW = W - PAD.left - PAD.right;
  const plotH = H - PAD.top  - PAD.bottom;

  // Grid + Y-axis ticks
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#999';
  ctx.strokeStyle = '#f0f0f0';
  ctx.lineWidth = 1;

  let t = scale.min;
  while (t <= scale.max + 1e-9) {
    const y = PAD.top + (1 - (t - scale.min) / (scale.max - scale.min)) * plotH;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(W - PAD.right, y);
    ctx.stroke();
    ctx.fillText(t.toFixed(3), PAD.left - 6, y);
    t = Math.round((t + scale.step) * 1e6) / 1e6;
  }

  // Y-axis label
  ctx.save();
  ctx.translate(13, PAD.top + plotH / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '10px system-ui, sans-serif';
  ctx.fillStyle = '#aaa';
  ctx.fillText('Index (rebased to 1.000)', 0, 0);
  ctx.restore();

  // X-axis labels
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.font = '9px system-ui, sans-serif';
  ctx.fillStyle = '#999';
  const step = Math.ceil(n / 24);
  for (let i = 0; i < n; i += step) {
    const x = PAD.left + (i / (n - 1)) * plotW;
    ctx.save();
    ctx.translate(x, H - PAD.bottom + 6);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(fmtDate(EMBEDDED.dates[i]), 0, 0);
    ctx.restore();
  }
  // Always draw last label
  {
    const x = PAD.left + plotW;
    ctx.save();
    ctx.translate(x, H - PAD.bottom + 6);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText(fmtDate(EMBEDDED.dates[n - 1]), 0, 0);
    ctx.restore();
  }

  // Hover crosshair
  if (hoverIdx >= 0) {
    const x = PAD.left + (hoverIdx / (n - 1)) * plotW;
    ctx.beginPath(); ctx.moveTo(x, PAD.top); ctx.lineTo(x, H - PAD.bottom);
    ctx.strokeStyle = '#ccc'; ctx.lineWidth = 1; ctx.setLineDash([4, 3]);
    ctx.stroke(); ctx.setLineDash([]);
  }

  // Series lines
  SERIES.forEach(s => {
    if (!s.on) return;
    const vals = EMBEDDED.series[s.id] || [];
    ctx.beginPath();
    ctx.strokeStyle = s.color;
    ctx.lineWidth = s.thick ? 3 : 1.8;
    ctx.lineJoin = 'round';
    let pen = false;
    let prevX = null, prevY = null;
    for (let i = 0; i < n; i++) {
      const v = vals[i];
      if (v == null) { pen = false; continue; }
      const [x, y] = toCanvasXY(canvas, i, v, scale);
      if (!pen) { ctx.moveTo(x, y); pen = true; }
      else       { ctx.lineTo(x, y); }
      prevX = x; prevY = y;
    }
    ctx.stroke();

    // Hover dot
    if (hoverIdx >= 0 && vals[hoverIdx] != null) {
      const [x, y] = toCanvasXY(canvas, hoverIdx, vals[hoverIdx], scale);
      ctx.beginPath();
      ctx.arc(x, y, s.thick ? 5 : 4, 0, Math.PI * 2);
      ctx.fillStyle = s.color; ctx.fill();
      ctx.strokeStyle = 'white'; ctx.lineWidth = 1.5; ctx.stroke();
    }
  });

  // Axes border
  ctx.strokeStyle = '#e0e0e0'; ctx.lineWidth = 1;
  ctx.strokeRect(PAD.left, PAD.top, plotW, plotH);
}

// ── Tooltip ───────────────────────────────────────────────────────
function updateTooltip(e) {
  const canvas = getCanvas();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const n = EMBEDDED.dates.length;
  const plotW = canvas.clientWidth - PAD.left - PAD.right;
  const frac  = (mx - PAD.left) / plotW;
  const idx   = Math.round(frac * (n - 1));

  if (idx < 0 || idx >= n) {
    hoverIdx = -1;
    document.getElementById('tooltip').style.display = 'none';
    draw(); return;
  }

  hoverIdx = idx;
  draw();

  const tt = document.getElementById('tooltip');
  const title = document.getElementById('tt-title');
  const body  = document.getElementById('tt-body');
  title.textContent = fmtDate(EMBEDDED.dates[idx]);
  let html = '';
  SERIES.forEach(s => {
    if (!s.on) return;
    const v = (EMBEDDED.series[s.id] || [])[idx];
    if (v == null) return;
    html += `<div class="tt-row"><span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${s.color};margin-right:5px;vertical-align:middle"></span>${s.short}: <b>${v.toFixed(4)}</b></div>`;
  });
  body.innerHTML = html;

  // Position tooltip
  const wrap = document.getElementById('chartWrap');
  const wRect = wrap.getBoundingClientRect();
  const canvasX = PAD.left + (idx / (n - 1)) * plotW;
  let left = canvasX + 16;
  if (left + 230 > canvas.clientWidth) left = canvasX - 230;
  tt.style.left = left + 'px';
  tt.style.top  = (PAD.top + 10) + 'px';
  tt.style.display = 'block';
}

// ── Toggles ───────────────────────────────────────────────────────
function renderToggles() {
  const el = document.getElementById('toggles');
  el.innerHTML = '';
  SERIES.forEach((s, i) => {
    const c = document.createElement('div');
    c.className = `chip ${s.on ? 'on' : 'off'}`;
    if (s.on) { c.style.backgroundColor = s.color; c.style.borderColor = s.color; }
    c.innerHTML = `<span class="chip-dot" style="background:${s.on ? 'rgba(255,255,255,0.8)' : s.color}"></span>${s.short}`;
    c.title = s.label;
    c.onclick = () => { s.on = !s.on; renderToggles(); draw(); };
    el.appendChild(c);
  });
}

// ── Download ──────────────────────────────────────────────────────
function downloadChart() {
  const canvas = getCanvas();
  const url = canvas.toDataURL('image/jpeg', 0.95);
  const a = document.createElement('a');
  a.href = url; a.download = 'freight-price-index.jpg'; a.click();
}

// ── Init ──────────────────────────────────────────────────────────
function main() {
  renderToggles();
  resize();
  document.getElementById('statusRange').textContent =
    `${EMBEDDED.dates[0]} → ${EMBEDDED.dates[EMBEDDED.dates.length - 1]}`;
  document.getElementById('statusFetch').textContent =
    `Updated ${EMBEDDED.updatedAt.slice(0, 10)}`;

  const canvas = getCanvas();
  canvas.addEventListener('mousemove', updateTooltip);
  canvas.addEventListener('mouseleave', () => {
    hoverIdx = -1;
    document.getElementById('tooltip').style.display = 'none';
    draw();
  });
  window.addEventListener('resize', resize);
}

document.addEventListener('DOMContentLoaded', main);
</script>
